<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rīga Centre Parking</title>
  <meta name="description" content="Underground and multi-storey car parks inside Rīga's railway loop, with capacity and observed occupancy by date.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <aside id="panel" aria-label="Parking list">
    <header>
      <h1>Rīga centre parking</h1>
      <p class="sub">Underground &amp; multi-storey car parks inside the railway loop</p>
    </header>

    <label class="field">
      <span>Show occupancy on</span>
      <select id="date-select"></select>
    </label>

    <div class="legend" aria-label="Legend">
      <span><i class="dot lvl-low"></i>&lt; 60%</span>
      <span><i class="dot lvl-mid"></i>60–85%</span>
      <span><i class="dot lvl-high"></i>&gt; 85%</span>
      <span><i class="dot lvl-none"></i>no data</span>
    </div>

    <div id="summary" class="summary"></div>
    <ul id="list" class="list"></ul>

    <footer>
      Data: <a href="data/parkings.json">parkings.json</a> ·
      <a href="data/observations.csv">observations.csv</a>
    </footer>
  </aside>

  <main id="map" aria-label="Map"></main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="assets/app.js"></script>
</body>
</html>
